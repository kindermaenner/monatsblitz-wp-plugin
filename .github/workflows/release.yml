name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: Run plugin CI
    uses: kindermaenner/ci-templates/.github/workflows/wordpress-plugin-pipeline.yml@main
    with:
      php-version: "8.4"
      run-sonar: true
      trigger-badges: false
      sonar-properties: >
        -Dsonar.projectKey=${{ github.event.repository.name }}
        -Dsonar.sources=src
        -Dsonar.tests=tests
        -Dsonar.php.coverage.reportPaths=coverage.xml
        -Dsonar.exclusions=vendor/**
        -Dsonar.php.file.suffixes=php
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  release:
    name: Build and publish release
    needs: validate
    uses: kindermaenner/ci-templates/.github/workflows/wordpress-plugin-release.yml@main
    with:
      plugin-file: monatsblitz.php
      plugin-slug: monatsblitz
      ftp-target-path: kindermaenner.de/plugin-updates/monatsblitz
      public-url: https://kindermaenner.de/plugin-updates/monatsblitz
      php-version: "8.4"
    secrets:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
