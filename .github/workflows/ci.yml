name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wordpress-plugin-pipeline:
    uses: kindermaenner/ci-templates/.github/workflows/wordpress-plugin-pipeline.yml@main
    with:
      php-version: "8.4"
      run-sonar: ${{ github.ref == 'refs/heads/main' }}
      trigger-badges: ${{ github.ref == 'refs/heads/main' }}
      sonar-properties: >
        -Dsonar.projectKey=${{ github.event.repository.name }}
        -Dsonar.sources=src
        -Dsonar.tests=tests
        -Dsonar.php.coverage.reportPaths=coverage.xml
        -Dsonar.exclusions=vendor/**
        -Dsonar.php.file.suffixes=php
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      BADGE_APP_ID: ${{ secrets.BADGE_APP_ID }}
      BADGE_APP_PRIVATE_KEY: ${{ secrets.BADGE_APP_PRIVATE_KEY }}
