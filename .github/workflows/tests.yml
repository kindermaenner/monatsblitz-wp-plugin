name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:

jobs:
  pest:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: [8.4]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pdo, pdo_mysql, dom
          coverage: xdebug

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run Pest tests with coverage
        run: vendor/bin/pest --coverage --coverage-clover=coverage.xml --min=80

      - name: Install SonarScanner CLI
        run: |
          wget https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux.zip
          unzip sonar-scanner-cli-5.0.1.3006-linux.zip
          sudo mv sonar-scanner-5.0.1.3006-linux /opt/sonar-scanner
          echo "/opt/sonar-scanner/bin" >> $GITHUB_PATH

      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          sonar-scanner \
            -Dsonar.projectKey=monatsblitz-wp-plugin \
            -Dsonar.sources=src \
            -Dsonar.php.coverage.reportPaths=coverage.xml \
            -Dsonar.tests=tests \
            -Dsonar.exclusions=vendor/** \
            -Dsonar.php.file.suffixes=php

  update-badges:
    needs: pest
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.BADGE_APP_ID }}
          private-key: ${{ secrets.BADGE_APP_PRIVATE_KEY }}
          owner: kindermaenner
          repositories: sonar-badges
          permission-actions: write

      - name: Trigger badge generation
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          curl --fail-with-body -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            https://api.github.com/repos/kindermaenner/sonar-badges/actions/workflows/update.yml/dispatches \
            -d '{
              "ref": "main",
              "inputs": {
                "project": "monatsblitz-wp-plugin"
              }
            }'
